<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quinyx Workers (328231)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    form {
      display: grid;
      gap: 0.75rem;
      max-width: 360px;
      margin-bottom: 1rem;
    }
    label {
      display: grid;
      gap: 0.25rem;
      font-weight: 600;
    }
    input {
      padding: 0.5rem;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 0.9rem;
      font-size: 1rem;
      cursor: pointer;
    }
    pre {
      background: #111827;
      color: #f9fafb;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Quinyx Login &amp; Workers (328231)</h1>
  <p id="status">Status: sessie controleren...</p>

  <form id="loginForm" action="javascript:void(0)" method="post" novalidate>
    <label for="username">
      Gebruikersnaam / E-mail
      <input type="text" id="username" name="username" autocomplete="username" required />
    </label>

    <label for="password">
      Wachtwoord
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </label>

    <button id="loginBtn" type="submit">Inloggen (POST /api/login)</button>
  </form>

  <div class="actions">
    <button id="refreshBtn" type="button" disabled>Workers ophalen</button>
    <button id="logoutBtn" type="button" disabled>Uitloggen</button>
  </div>

  <pre id="output">Nog geen data opgehaald.</pre>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    function setLoggedIn(isLoggedIn) {
      refreshBtn.disabled = !isLoggedIn;
      logoutBtn.disabled = !isLoggedIn;
      statusEl.textContent = isLoggedIn
        ? "Status: ingelogd via proxy"
        : "Status: niet ingelogd";
    }

    async function fetchWorkers() {
      outputEl.textContent = "Workers ophalen via GET /api/workers...";
      const res = await fetch("/api/workers", {
        method: "GET",
        headers: { Accept: "application/json" }
      });

      const body = await res.json().catch(() => ({}));

      if (res.status === 401) {
        setLoggedIn(false);
        outputEl.textContent = body.error || "Sessie verlopen (401). Log opnieuw in.";
        return;
      }

      if (!res.ok) {
        throw new Error(body.error || `Fout bij /api/workers (HTTP ${res.status})`);
      }

      outputEl.textContent = JSON.stringify(body, null, 2);
    }

    async function checkSession() {
      try {
        const res = await fetch("/api/session", { cache: "no-store" });
        const session = await res.json().catch(() => ({ authenticated: false }));
        setLoggedIn(Boolean(session.authenticated));

        if (session.authenticated) {
          await fetchWorkers();
        }
      } catch (err) {
        setLoggedIn(false);
        statusEl.textContent = "Status: kon /api/session niet bereiken";
        outputEl.textContent = err.message;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      event.stopPropagation();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        outputEl.textContent = "Vul zowel gebruikersnaam als wachtwoord in.";
        return;
      }

      loginBtn.disabled = true;
      statusEl.textContent = "Status: POST /api/login uitvoeren...";
      outputEl.textContent = "Bezig met inloggen...";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(
            data.error || `Login mislukt (HTTP ${res.status})`
          );
        }

        setLoggedIn(true);
        await fetchWorkers();
      } catch (err) {
        setLoggedIn(false);
        outputEl.textContent = `Fout tijdens login: ${err.message}`;
      } finally {
        loginBtn.disabled = false;
      }
    });

    refreshBtn.addEventListener("click", async () => {
      try {
        await fetchWorkers();
      } catch (err) {
        outputEl.textContent = `Fout: ${err.message}`;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" }).catch(() => {});
      setLoggedIn(false);
      outputEl.textContent = "Uitgelogd.";
    });

    checkSession();
  </script>
</body>
</html>
